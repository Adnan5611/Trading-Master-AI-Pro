name: CI

# Phase 1 quality gate. Actions are pinned to verified release commit SHAs
# (not floating tags) and the workflow runs with read-only permissions.
# No secrets are used and live trading is never enabled in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=low
