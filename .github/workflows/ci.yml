name: Trading Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["fix/phase-1-trading-core-audit"]

permissions:
  contents: read

jobs:
  quality:
    name: Tests, TypeScript, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies (fail on any vulnerability)
        run: npm audit --audit-level=low
      - name: Run unit tests
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck
